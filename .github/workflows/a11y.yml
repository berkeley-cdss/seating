name: A11y

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  audit-a11y-with-axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap
        uses: ./.github/actions/bootstrap
      - name: Exports all GitHub Environment Secrets
        uses: oNaiPs/secrets-to-env-action@v1
        with:
          secrets: ${{ toJSON(secrets) }}
      - name: Exports all GitHub Environment Variables
        uses: oNaiPs/secrets-to-env-action@v1
        with:
          secrets: ${{ toJSON(vars) }}
      # Secrets and vars aren't passed to pull requests from forks, so fall
      # back to dummy values; tests mock Canvas and never call Google Sheets
      - name: Default missing env for fork PRs
        run: |
          echo "FLASK_APP=${FLASK_APP:-server}" >> "$GITHUB_ENV"
          echo "FLASK_ENV=${FLASK_ENV:-testing}" >> "$GITHUB_ENV"
          echo "CANVAS_SERVER_URL=${CANVAS_SERVER_URL:-https://canvas.example.edu}" >> "$GITHUB_ENV"
          echo "CANVAS_CLIENT_ID=${CANVAS_CLIENT_ID:-test}" >> "$GITHUB_ENV"
          echo "CANVAS_CLIENT_SECRET=${CANVAS_CLIENT_SECRET:-test}" >> "$GITHUB_ENV"
      - name: Run A11y Audit
        run: |
          pytest -s tests/a11y
