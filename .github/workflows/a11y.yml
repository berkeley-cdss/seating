name: A11y

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  audit-a11y-with-axe:
    runs-on: ubuntu-latest
    # map only the secrets/vars the flask app reads; fork PRs get no secrets
    # or vars, so fall back to dummy values (tests mock Canvas and never call
    # Google Sheets)
    env:
      FLASK_APP: ${{ vars.FLASK_APP || 'server' }}
      FLASK_ENV: ${{ vars.FLASK_ENV || 'testing' }}
      MOCK_CANVAS: ${{ vars.MOCK_CANVAS }}
      CANVAS_SERVER_URL: ${{ vars.CANVAS_SERVER_URL || 'https://canvas.example.edu' }}
      CANVAS_CLIENT_ID: ${{ secrets.CANVAS_CLIENT_ID || 'test' }}
      CANVAS_CLIENT_SECRET: ${{ secrets.CANVAS_CLIENT_SECRET || 'test' }}
      GCP_SA_CRED_TYPE: ${{ vars.GCP_SA_CRED_TYPE }}
      GCP_SA_CRED_VALUE: ${{ secrets.GCP_SA_CRED_VALUE }}
      MASTER_ROOM_SHEET_URL: ${{ vars.MASTER_ROOM_SHEET_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap
        uses: ./.github/actions/bootstrap
      - name: Run A11y Audit
        run: |
          pytest -s tests/a11y
