name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "45 22 * * 5"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # actions scans the workflow files themselves (script injection, untrusted
        # checkouts, excessive permissions). None of these need a build step.
        language: ["python", "javascript-typescript", "actions"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # third-party minified libraries we don't maintain; inline <script> blocks in
          # the .j2 templates aren't scanned either, since CodeQL doesn't read Jinja
          config: |
            paths-ignore:
              - server/static/vendor
              - tests/a11y/axe.min.js

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
