name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  unit-test-with-pytest:
    strategy:
      matrix:
        test-type: ["unit", "e2e"]
        python-version: ["3.14"]
    runs-on: ubuntu-latest
    # map only the secrets/vars the flask app reads; fork PRs get no secrets
    # or vars, so fall back to dummy values (tests mock Canvas and never call
    # Google Sheets)
    env:
      FLASK_APP: ${{ vars.FLASK_APP || 'server' }}
      FLASK_ENV: ${{ vars.FLASK_ENV || 'testing' }}
      MOCK_CANVAS: ${{ vars.MOCK_CANVAS }}
      CANVAS_SERVER_URL: ${{ vars.CANVAS_SERVER_URL || 'https://canvas.example.edu' }}
      CANVAS_CLIENT_ID: ${{ secrets.CANVAS_CLIENT_ID || 'test' }}
      CANVAS_CLIENT_SECRET: ${{ secrets.CANVAS_CLIENT_SECRET || 'test' }}
      GCP_SA_CRED_TYPE: ${{ vars.GCP_SA_CRED_TYPE }}
      GCP_SA_CRED_VALUE: ${{ secrets.GCP_SA_CRED_VALUE }}
      MASTER_ROOM_SHEET_URL: ${{ vars.MASTER_ROOM_SHEET_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Bootstrap
        uses: ./.github/actions/bootstrap
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare reports directory
        run: |
          mkdir -p reports
          touch reports/pytest-${{ matrix.test-type }}.txt
          touch reports/pytest-coverage-${{ matrix.test-type }}.txt
      - name: Run tests with pytest and generate reports
        run: |
          # make sure pipe propogates exit code to fail CI on test failure
          set -o pipefail
          pytest --junitxml=reports/pytest-${{ matrix.test-type }}.xml --cov-report=term-missing:skip-covered --cov=server tests/${{ matrix.test-type }}/ | tee reports/pytest-coverage-${{ matrix.test-type }}.txt
          set +o pipefail
      - name: Pytest coverage comment
        uses: MishaKav/pytest-coverage-comment@9ee59af31bd7bcada1cc496f086b407122602dbd # v1.12.3
        # no need to comment on merging to main; only need for pr
        # it will fail anyway because of branch protection rejects commit comments
        # fork PRs get a read-only token that can't comment, so skip them too
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          title: Coverage for ${{ matrix.test-type }} tests for Python ${{ matrix.python-version }}
          unique-id-for-comment: ${{ matrix.test-type }}-${{ matrix.python-version }}
          pytest-coverage-path: reports/pytest-coverage-${{ matrix.test-type }}.txt
          junitxml-path: reports/pytest-${{ matrix.test-type }}.xml
      # fork PRs can't get the comment above, so show the report on the run's summary page instead
      - name: Pytest coverage summary
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          {
            echo "### Coverage for ${{ matrix.test-type }} tests for Python ${{ matrix.python-version }}"
            echo '```'
            cat reports/pytest-coverage-${{ matrix.test-type }}.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
