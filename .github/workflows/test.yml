name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  unit-test-with-pytest:
    strategy:
      matrix:
        test-type: ["unit", "e2e"]
        python-version: ["3.14"]
    runs-on: ubuntu-latest
    # map only the secrets/vars the flask app reads; fork PRs get no secrets
    # or vars, so fall back to dummy values (tests mock Canvas and never call
    # Google Sheets)
    env:
      FLASK_APP: ${{ vars.FLASK_APP || 'server' }}
      FLASK_ENV: ${{ vars.FLASK_ENV || 'testing' }}
      MOCK_CANVAS: ${{ vars.MOCK_CANVAS }}
      CANVAS_SERVER_URL: ${{ vars.CANVAS_SERVER_URL || 'https://canvas.example.edu' }}
      CANVAS_CLIENT_ID: ${{ secrets.CANVAS_CLIENT_ID || 'test' }}
      CANVAS_CLIENT_SECRET: ${{ secrets.CANVAS_CLIENT_SECRET || 'test' }}
      GCP_SA_CRED_TYPE: ${{ vars.GCP_SA_CRED_TYPE }}
      GCP_SA_CRED_VALUE: ${{ secrets.GCP_SA_CRED_VALUE }}
      MASTER_ROOM_SHEET_URL: ${{ vars.MASTER_ROOM_SHEET_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Bootstrap
        uses: ./.github/actions/bootstrap
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare reports directory
        run: |
          mkdir -p reports
          touch reports/pytest-coverage-${{ matrix.test-type }}.txt
      - name: Run tests with pytest and generate reports
        run: |
          # make sure pipe propogates exit code to fail CI on test failure
          set -o pipefail
          pytest --cov-report=term-missing:skip-covered --cov=server tests/${{ matrix.test-type }}/ | tee reports/pytest-coverage-${{ matrix.test-type }}.txt
          set +o pipefail
      # the per-file report, on the run's summary page; Codecov's PR comment has the totals per test type
      - name: Pytest coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Coverage for ${{ matrix.test-type }} tests for Python ${{ matrix.python-version }}"
            echo '```'
            cat reports/pytest-coverage-${{ matrix.test-type }}.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # keeps unit and e2e coverage apart in Codecov, instead of one merged number
          flags: ${{ matrix.test-type }}
