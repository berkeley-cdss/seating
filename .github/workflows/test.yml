name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  unit-test-with-pytest:
    strategy:
      matrix:
        test-type: ["unit", "e2e"]
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bootstrap
        uses: ./.github/actions/bootstrap
        with:
          python-version: ${{ matrix.python-version }}
      # values set in GitHub repo vars/secrets are available as env vars in os
      # but flask app expects them from os (flask uses os.getenv to fetech them)
      # so we need to export them to os
      - name: Exports all GitHub Environment Secrets
        uses: oNaiPs/secrets-to-env-action@v1
        with:
          secrets: ${{ toJSON(secrets) }}
      - name: Exports all GitHub Environment Variables
        uses: oNaiPs/secrets-to-env-action@v1
        with:
          secrets: ${{ toJSON(vars) }}
      # Secrets and vars aren't passed to pull requests from forks, so fall
      # back to dummy values; tests mock Canvas and never call Google Sheets
      - name: Default missing env for fork PRs
        run: |
          echo "FLASK_APP=${FLASK_APP:-server}" >> "$GITHUB_ENV"
          echo "FLASK_ENV=${FLASK_ENV:-testing}" >> "$GITHUB_ENV"
          echo "CANVAS_SERVER_URL=${CANVAS_SERVER_URL:-https://canvas.example.edu}" >> "$GITHUB_ENV"
          echo "CANVAS_CLIENT_ID=${CANVAS_CLIENT_ID:-test}" >> "$GITHUB_ENV"
          echo "CANVAS_CLIENT_SECRET=${CANVAS_CLIENT_SECRET:-test}" >> "$GITHUB_ENV"
      - name: Prepare reports directory
        run: |
          mkdir -p reports
          touch reports/pytest-${{ matrix.test-type }}.txt
          touch reports/pytest-coverage-${{ matrix.test-type }}.txt
      - name: Run tests with pytest and generate reports
        run: |
          # make sure pipe propogates exit code to fail CI on test failure
          set -o pipefail
          pytest --junitxml=reports/pytest-${{ matrix.test-type }}.xml --cov-report=term-missing:skip-covered --cov=server tests/${{ matrix.test-type }}/ | tee reports/pytest-coverage-${{ matrix.test-type }}.txt
          set +o pipefail
      - name: Pytest coverage comment
        uses: MishaKav/pytest-coverage-comment@main
        # no need to comment on merging to main; only need for pr
        # it will fail anyway because of branch protection rejects commit comments
        # fork PRs get a read-only token that can't comment, so skip them too
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          title: Coverage for ${{ matrix.test-type }} tests for Python ${{ matrix.python-version }}
          create-new-comment: true
          pytest-coverage-path: reports/pytest-coverage-${{ matrix.test-type }}.txt
          junitxml-path: reports/pytest-${{ matrix.test-type }}.xml
      # fork PRs can't get the comment above, so show the report on the run's summary page instead
      - name: Pytest coverage summary
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          {
            echo "### Coverage for ${{ matrix.test-type }} tests for Python ${{ matrix.python-version }}"
            echo '```'
            cat reports/pytest-coverage-${{ matrix.test-type }}.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
