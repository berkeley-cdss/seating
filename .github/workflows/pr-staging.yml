name: PR Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_STAGING_SA_KEY }}

      - name: Delete Cloud Run Preview Service
        run: |
          gcloud run services delete preview-seating-pr-${{ github.event.number }} \
            --region=us-west1 \
            --quiet || true

  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_STAGING_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run (Preview)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: preview-seating-pr-${{ github.event.number }}
          region: us-west1
          source: .
          flags: '--allow-unauthenticated --service-account=seating-run@staging-cdss-web-apps.iam.gserviceaccount.com'
          env_vars: |
            FLASK_APP=server
            FLASK_ENV=staging
            SERVER_BASE_URL=https://preview-seating-pr-${{ github.event.number }}-137456085712.us-west1.run.app/
            WIKI_BASE_URL=https://github.com/berkeley-cdss/seating/wiki/
            LOCAL_TIMEZONE=US/Pacific
            CANVAS_SERVER_URL=https://bcourses.berkeley.edu/
            MOCK_CANVAS=false
            C1C_API_DOMAIN=https://c1c-api.sait-west.berkeley.edu
            C1C_PHOTO_CACHE_LIFE=7776000
            MOCK_C1C=false
            EMAIL_SERVER=bcop.berkeley.edu
            EMAIL_PORT=587
            EMAIL_SENDER=seamless-learning@berkeley.edu
            EMAIL_USERNAME=svc-bcop-seamless-learning
            GCP_SA_CRED_TYPE=env
            MASTER_ROOM_SHEET_URL=https://docs.google.com/spreadsheets/d/16a1uZJl54A5_J2XpyzIBblH7LPlFCKc5Cx86CFTbZTA/edit?usp=sharing
          secrets: |
            CANVAS_CLIENT_ID=seating-canvas-client-id:latest
            CANVAS_CLIENT_SECRET=seating-canvas-client-secret:latest
            C1C_API_USERNAME=seating-c1c-api-username:latest
            C1C_API_PASSWORD=seating-c1c-api-password:latest
            C1C_PROXY_URL=seating-c1c-proxy-url:latest
            FIXIE_URL=seating-fixie-url:latest
            EMAIL_PASSWORD=seating-email-password:latest
            DATABASE_URL=seating-database-url:latest
            SECRET_KEY=seating-secret-key:latest
            GCP_SA_CRED_VALUE=seating-gcp-sa-cred-value:latest

      - name: Comment PR with Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 **Staging Preview Deployed!**\n\nURL: ${{ steps.deploy.outputs.url }}'
            })